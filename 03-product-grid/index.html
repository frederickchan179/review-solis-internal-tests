<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Grid Test</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <div class="page__header">
      <h1 class="page__title">All Products</h1>
      <button class="page__reset" id="resetBtn">Reset Grid</button>
    </div>

    <div class="product-grid" id="grid"></div>

    <div class="product-grid__footer">
      <button class="product-grid__load-more" id="loadMoreBtn">Load more</button>
      <p class="product-grid__hint">Tip: also try scrolling to the bottom of the page.</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
