server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  sendfile on;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json text/markdown;

  # Hub uses client hash routes; real files live under /hub and /exercises.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  location = /exercises/manifest.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }
}
