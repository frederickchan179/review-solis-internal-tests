server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  sendfile on;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json text/markdown;

  # Hub shell changes often; never let browsers keep stale CSS/JS after a deploy.
  location = / {
    add_header Cache-Control "no-store";
    try_files /index.html =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location ^~ /hub/ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /exercises/manifest.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location ~* ^/exercises/(AGENTS|REVIEWS)\.md$ {
    default_type text/markdown;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location ~* \.md$ {
    default_type text/markdown;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Static fixture assets can cache briefly; hash routes stay on index.html.
  location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    expires 1d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
