<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Autocomplete Test</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1 class="page__title">Search Products</h1>

    <div class="autocomplete" id="autocomplete">
      <input class="autocomplete__input" id="searchInput" type="text" placeholder="Search products..." autocomplete="off">
      <ul class="autocomplete__list" id="autocompleteList" hidden></ul>
    </div>

    <p class="page__hint">Find accessories, gadgets, and more from our catalog.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
