<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Review Solis Internal Tests</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github.min.css"
    />
    <link rel="stylesheet" href="hub/app.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <h1>Review Solis Internal Tests</h1>
        <p class="credit">by Fred&apos;s Cursor AI</p>
        <p class="hint">Pick an exercise, try it live, browse its files on the right.</p>
        <a class="text-link topbar-link" id="open-agents" href="#/agents">All agent prompts</a>
      </header>

      <aside class="sidebar" aria-label="Exercises">
        <div class="panel-bar">
          <span class="panel-label">Exercises</span>
        </div>
        <ol class="nav" id="nav"></ol>
        <div class="sidebar-foot">
          <a class="btn-agents" id="open-agents-side" href="#/agents">All agent prompts</a>
        </div>
      </aside>

      <section class="stage" aria-label="Live fixture">
        <div class="panel-bar stage-bar">
          <span class="title" id="stage-title">Loading…</span>
          <span class="path mono" id="stage-path"></span>
          <div
            class="seg-tabs"
            id="viewport-tabs"
            role="tablist"
            aria-label="Viewport size"
          >
            <button
              type="button"
              role="tab"
              data-viewport="mobile"
              aria-selected="false"
              title="390px"
            >
              Mobile
            </button>
            <button
              type="button"
              role="tab"
              data-viewport="tablet"
              aria-selected="false"
              title="768px"
            >
              Tablet
            </button>
            <button
              type="button"
              role="tab"
              data-viewport="desktop"
              aria-selected="true"
              title="Full width"
            >
              Desktop
            </button>
          </div>
          <span class="mono viewport-size" id="viewport-size" aria-live="polite"
            >Fluid</span
          >
          <a class="text-link" id="open-tab" href="#" target="_blank" rel="noopener"
            >Open in new tab</a
          >
        </div>
        <div class="frame-wrap" id="frame-wrap" data-viewport="desktop">
          <div class="frame-shell">
            <iframe id="fixture" title="Exercise fixture"></iframe>
          </div>
        </div>
      </section>

      <button
        type="button"
        class="splitter"
        id="review-splitter"
        aria-label="Resize files panel"
        aria-orientation="vertical"
        aria-controls="source-panel"
        title="Drag to resize. Double-click to reset."
      ></button>

      <aside class="source-panel" id="source-panel" aria-label="Exercise files">
        <div class="panel-bar source-bar">
          <span class="panel-label">Files</span>
          <ul class="file-list" id="file-list" role="tablist" aria-label="Exercise files"></ul>
        </div>
        <div class="source-body loading" id="source-body">Pick a file to view.</div>
      </aside>
    </div>

    <script type="module" src="hub/app.js"></script>
  </body>
</html>
